name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC: catch toolchain churn (Zig, .NET, ...) without a push
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The shared scripts (new_day, resolve_day, bench_day, collect_benches)
      # live in the lang-templates submodule; run its tests at the pinned commit.
      - name: Unit tests
        run: python3 -m unittest discover -s lang-templates/scripts -p 'test_*.py'

  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./lang-templates/.github/actions/setup-toolchains
        with:
          lang: python

      # The checkout is disposable. Year repos created from this template
      # may already have committed solutions for day 1, which would make the
      # scaffold land in day-01-python-vN and leave `just test 1` ambiguous.
      - name: Clear committed days
        run: rm -rf days benchmarks.md benchmarks.json

      - name: Scaffold day 1
        run: just new-day 1 python

      - name: Write sample input
        run: printf 'foo\nbar\nbaz\n' > days/day-01-python-v1/input.txt

      - name: Test
        run: just test 1

      - name: Run part 1 and part 2
        run: |
          set -euo pipefail
          p1="$(just run 1 1 2>/dev/null)"
          p2="$(just run 1 2 2>/dev/null)"
          echo "part1=[$p1] part2=[$p2]"
          [ "$p1" = "3" ] || { echo "part 1: expected 3, got '$p1'" >&2; exit 1; }
          [ "$p2" = "9" ] || { echo "part 2: expected 9, got '$p2'" >&2; exit 1; }

      - name: Benchmark
        run: |
          set -euo pipefail
          just bench 1
          test -f days/day-01-python-v1/bench.json
          test ! -f days/day-01-python-v1/bench.md
          python3 - days/day-01-python-v1/bench.json <<'EOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["schema"] == 1, data["schema"]
          parts = data["parts"]
          assert [p["part"] for p in parts] == [1, 2], parts
          assert [p["answer"] for p in parts] == ["3", "9"], parts
          for p in parts:
              ns = p["ns"]
              for key in ("min", "median", "mean", "stddev", "p99", "max"):
                  assert isinstance(ns[key], (int, float)) and ns[key] >= 0, (p["part"], key, ns)
          print("bench.json ok")
          EOF
          test -f benchmarks.json
          grep -q '^| Day | Part | Rank |' benchmarks.md
          grep -q '`day-01-python-v1`' benchmarks.md
          grep -q '^## Runs$' benchmarks.md

      - name: Repo stayed clean
        run: |
          status="$(git status --porcelain -- justfile README.md lang-templates .gitignore .github)"
          if [ -n "$status" ]; then
            echo "scaffolding modified tracked repo files:" >&2
            echo "$status" >&2
            exit 1
          fi

  detect:
    runs-on: ubuntu-latest
    outputs:
      has_days: ${{ steps.check.outputs.has_days }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          if ls -d days/day-[0-9][0-9]-*-v*/justfile >/dev/null 2>&1; then
            echo "has_days=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_days=false" >> "$GITHUB_OUTPUT"
          fi

  # Validates the committed days of a year repo; skipped in the bare template.
  days:
    needs: detect
    if: needs.detect.outputs.has_days == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./lang-templates/.github/actions/setup-toolchains
        with:
          lang: all

      - name: Test all days
        run: just test-all
